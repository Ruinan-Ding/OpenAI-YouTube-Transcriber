# black is deliberately not enabled: it wants 88 columns and double quotes, while
# this codebase is 100 columns and single quotes (see .flake8). Turning it on
# reformats ~450 lines to no benefit. flake8 below is the enforced standard.
repos:
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort

  - repo: https://github.com/pre-commit/mirrors-flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        additional_dependencies: ["flake8-bugbear"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace